[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bullet-visual"
version = "0.2.0"
description = "Configurable camera capture and bounding-box publisher for Bullet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["bullet-image-transport", "bullet-simulation-protocol", "bullet-perception", "click>=8.5,<9", "loguru>=0.7,<1", "numpy>=2,<3", "opencv-python>=4.10,<5", "pyzmq>=27,<28", "pyyaml>=6,<7"]

[project.scripts]
bullet-visual = "bullet_visual.main:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv.sources]
bullet-image-transport = { path = "../bullet_drone/libs/bullet_image_transport", editable = true }
bullet-simulation-protocol = { path = "../bullet_drone/libs/bullet_simulation_protocol", editable = true }
bullet-perception = { path = "../bullet_perception", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
